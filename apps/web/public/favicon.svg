<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="posGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <!-- Outer Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#posGrad)" />
  <!-- Screen Display -->
  <rect x="12" y="10" width="40" height="24" rx="5" fill="url(#screenGrad)" />
  <circle cx="20" cy="18" r="2.5" fill="#22c55e" />
  <rect x="26" y="16" width="18" height="4" rx="2" fill="#38bdf8" />
  <rect x="18" y="24" width="28" height="4" rx="2" fill="#94a3b8" />
  <!-- Keypad & Register -->
  <rect x="12" y="38" width="40" height="16" rx="4" fill="#ffffff" fill-opacity="0.2" />
  <circle cx="20" cy="46" r="2.5" fill="#ffffff" />
  <circle cx="28" cy="46" r="2.5" fill="#ffffff" />
  <circle cx="36" cy="46" r="2.5" fill="#ffffff" />
  <circle cx="44" cy="46" r="2.5" fill="#22c55e" />
</svg>
